name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libudev-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run CI quality checks
        run: scripts/ci/check.sh quality

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x64
            os: ubuntu-latest
            build_scope: full
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            build_scope: full
          - name: macos-arm64
            os: macos-14
            build_scope: desktop
          - name: windows-x64
            os: windows-latest
            build_scope: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libudev-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build full workspace on Ubuntu
        if: matrix.build_scope == 'full'
        run: scripts/ci/check.sh build-full

      - name: Build desktop workspace on macOS and Windows
        if: matrix.build_scope == 'desktop'
        run: scripts/ci/check.sh build-desktop

      - name: Validate macOS app packaging
        if: matrix.name == 'macos-arm64'
        run: scripts/ci/check.sh package-macos
